name: Client CI

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout client
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Offline: fails when a layer update needs stir-compliance-init, before the
      # live compliance audit stops a deployment.
      - name: Check compliance review checklists
        run: pnpm exec stir-compliance-init --check

      - name: Verify lint, types, tests and production build
        run: pnpm verify:ci
