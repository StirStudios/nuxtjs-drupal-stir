name: CI

on:
  push:
    branches:
      - dev
      - main
      - master
      - release/**
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit message check reads the pushed commits.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # This repository is public; verify:core checks the files.
      - name: Commit messages name no client project
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in
            0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}~1..${RANGE#*..}" ;;
          esac
          node scripts/audit/private-names.mjs --commits "$RANGE"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Inventory source imports
        run: pnpm perf:imports

      - name: Upload source import inventory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-import-inventory
          path: .audit/source-imports.json
          include-hidden-files: true

      - name: Verify Core
        run: pnpm verify:core
        env:
          STIR_PERF_ANALYZE: 'true'

      - name: Check initial bundle boundaries and enforce size budgets
        run: pnpm perf:report --no-build

  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:consumer:typecheck
          - test:consumer:build
          - test:consumer:packed

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Consumer Layer Smoke Test
        run: pnpm ${{ matrix.command }}
