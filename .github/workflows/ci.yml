name: CI

on:
  push:
    branches:
      - dev
      - main
      - master
      - vnext
      - release/**
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # stir-tools is private and this repository is public, so the default
      # GITHUB_TOKEN cannot read the producer. Without STIR_TOOLS_CONTRACTS_TOKEN
      # the drift gate cannot run; say so loudly rather than passing silently.
      - name: Check out Stir Tools contracts
        if: ${{ secrets.STIR_TOOLS_CONTRACTS_TOKEN != '' }}
        uses: actions/checkout@v7
        id: stir_tools
        with:
          repository: StirStudios/stir-tools
          path: .stir-tools-contracts
          token: ${{ secrets.STIR_TOOLS_CONTRACTS_TOKEN }}

      - name: Check Stir Tools contract drift
        if: steps.stir_tools.outcome == 'success'
        run: pnpm contracts:check .stir-tools-contracts/contracts/v1

      - name: Report skipped contract drift gate
        if: steps.stir_tools.outcome != 'success'
        run: echo "::warning title=Contract drift gate skipped::STIR_TOOLS_CONTRACTS_TOKEN is not set, so the contract snapshot was not compared against the producer. Add a read-scoped token for StirStudios/stir-tools, or run 'pnpm contracts:check <stir-tools>/contracts/v1' locally."

      - name: Inventory source imports
        run: pnpm perf:imports

      - name: Upload source import inventory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-import-inventory
          path: .audit/source-imports.json
          include-hidden-files: true

      - name: Verify Core
        run: pnpm verify:core
        env:
          STIR_PERF_ANALYZE: 'true'

      - name: Check initial bundle boundaries and report size budgets
        run: pnpm perf:report --no-build --warn-budget

  consumer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        command:
          - test:consumer:typecheck
          - test:consumer:build
          - test:consumer:packed

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Consumer Layer Smoke Test
        run: pnpm ${{ matrix.command }}
